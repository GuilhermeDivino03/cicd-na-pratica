# CI: roda em todo push e em todo Pull Request.
# Objetivo: garantir que o código compila e os testes passam ANTES de entrar na main.
name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório pra máquina do GitHub
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instala o Java 21 e guarda as dependências do Maven em cache
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Compila, roda os testes e gera o .jar. Se um teste falhar, o pipeline fica vermelho aqui.
      - name: Build e testes
        run: mvn -B verify

      # 4. Guarda o .jar gerado pra você baixar na aba Actions
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
